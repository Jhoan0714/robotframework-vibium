name: Publish Libdoc

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install project (Libdoc imports the library)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # Pin Libdoc generator for reproducible docs (package still supports RF>=5.0).
          python -m pip install "robotframework==7.4.2"

      - name: Generate Libdoc HTML
        run: python -m robot.libdoc src/Vibium.py docs/VibiumLibrary.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
