name: Continuous Integration

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]
        robotframework-version: ["5.*", "6.*", "7.*"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install "robotframework==${{ matrix.robotframework-version }}"
          python -m pip show vibium

      - name: Format
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Unit tests
        run: pytest tests/unit --cov=rfvibium --cov-report=term-missing

      # - name: Acceptance tests
      #   run: robot --pythonpath src -v HEADLESS:True -e no-ci -d reports/acceptance tests/acceptance
